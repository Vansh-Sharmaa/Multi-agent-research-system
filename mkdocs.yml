site_name: Intellecta Multi-Agent Research System
site_description: Autonomous multi-agent AI engine for deep web research
site_author: Vansh Sharma
site_url: https://vansh-sharmaa.github.io/Multi-agent-research-system/

repo_name: Vansh-Sharmaa/Multi-agent-research-system
repo_url: https://github.com/Vansh-Sharmaa/Multi-agent-research-system

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Quick Start: getting-started/quickstart.md
  - Architecture:
      - Overview: architecture/overview.md
      - Agents: architecture/agents.md
      - Pipeline: architecture/pipeline.md
  - API Reference: api/reference.md
  - Deployment:
      - Docker: deployment/docker.md
      - Streamlit Cloud: deployment/streamlit.md
  - Contributing: contributing.md
  - Changelog: changelog.md